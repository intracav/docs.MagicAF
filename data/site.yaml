# Single source of truth for counts and catalog facts quoted in templates
# and content. Update numbers HERE ONLY — never hardcode them in prose.
#
# Verification sources:
#   lumen_ui.components  — count of pages under content/docs/lumen-ui/components/ (excluding _index.md)
#   lumen_ui.categories  — count of directories under content/docs/lumen-ui/components/
#   lumen_ui.clinical    — count of pages under content/docs/lumen-ui/components/clinical/ (excluding _index.md)
#   reflex_*             — MagicAF Reflex frozen eval sets: `rows` per file in
#                          ml/magicaf-reflex/data/frozen/FROZEN.json (lumen-extension
#                          main, merged 2b82df2). must_defer counts are
#                          rows with "must_defer": true in calibration.jsonl / test.jsonl.
#                          reflex_page_command_keys = keys in reflex.page_command.json.
#                          A re-freeze changes these: update them here, nowhere else.
#   reflex_model_name    — PUBLIC name of the selected Reflex model (owner decision
#                          2026-09-24: do not name the encoders; the family is being
#                          rebranded, so the name lives here and nowhere else).
#                          Internal artifact: model.json / MODEL_CARD.md, 0.1.0.
