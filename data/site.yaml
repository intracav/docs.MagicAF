  reflex_test_rows: "3,000"
  reflex_adversarial_rows: 250
  reflex_legacy_rows: 205
  reflex_pages: 647
  reflex_calibration_must_defer: "1,400"
  reflex_test_must_defer: "1,428"
  reflex_page_command_keys: 5
  reflex_model_name: "Reflex_01"


# Source access. The MagicAF repository is private (owner decision 2026-11-13):
# no "open-source" framing, no public GitHub links; teams request access.
access:
  contact: hello@intracav.ai
  repo_ssh: ssh://git@github.com/intracav/MagicAF.git   # Cargo needs the ssh:// form, not scp-style
  repo_https: https://github.com/intracav/MagicAF

# Docs sidebar: groups in order, each listing /docs paths (sections or pages).
# A path whose page doesn't exist yet is skipped, so nav can lead content.
nav:
  - group: Start
    items: [/docs/getting-started, /docs/learning-paths]
  - group: Learn
    items: [/docs/core-concepts, /docs/decision-guides]
  - group: Build
    items: [/docs/tutorials, /docs/guides, /docs/examples]
  - group: Crates
    items: [/docs/crates]
  - group: Operate
    items: [/docs/deployment]
  - group: Reference
    items: [/docs/api-reference, /docs/changelog]
  - group: Built on MagicAF
    items: [/docs/reflex, /docs/lumen-models, /docs/lumen-ui]
