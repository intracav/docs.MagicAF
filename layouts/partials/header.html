<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo" title="MagicAF documentation home">
      <span class="wordmark-primary">Magic</span><span class="wordmark-accent">AF</span>
    </a>

    <nav class="header-nav" aria-label="Main">
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if strings.HasPrefix .URL "http" }} rel="noopener noreferrer" target="_blank"{{ end }}>
        {{- if .Name }}{{ .Name }}{{ else if eq .Identifier "github" }}GitHub{{ end -}}
        {{- if findRE "://" .URL }}<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" height="11" width="11"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14L21 3"></path></svg>{{ end -}}
      </a>
      {{- end }}
    </nav>

    <div class="header-actions">
      <button id="search-toggle" class="search-toggle" title="Search (Ctrl+K / Cmd+K)" aria-label="Open search">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="search-kbd-hint">
          <kbd class="kbd-meta"></kbd><kbd>K</kbd>
        </span>
      </button>

      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark mode">
        <span class="theme-icon">&#9789;</span>
      </button>

      <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </div>
</header>
