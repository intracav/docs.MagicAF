baseURL: "https://magicaf.intracav.ai/"
languageCode: "en-us"
title: "MagicAF"

enableRobotsTXT: true
enableGitInfo: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

# No taxonomy or term pages — they were 276 thin pages with no inbound value.
# tags/categories frontmatter remains in content as inert metadata.
disableKinds:
  - taxonomy
  - term

# Dates come from git history; frontmatter dates win only if explicitly set.
frontmatter:
  date: [":git", "date", "publishDate"]
  lastmod: [":git", "lastmod", "date"]

# Sitemap configuration for SEO
sitemap:
  changefreq: "monthly"
  priority: 0.5
  filename: "sitemap.xml"

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # slim Fuse.js search index — layouts/_default/index.json

params:
  description: "Open-source Rust AI framework for RAG pipelines, NLP, embeddings, vector search, and LLM orchestration — built to run air-gapped with zero cloud dependencies, for environments where data cannot leave the network."
  keywords: [magicaf, rust, rag, embeddings, vector-search, llm, on-premises, air-gapped, framework, sdk, secure AI, airgapped AI, secure LLM, on-premises AI, NLP toolkit, RAG framework, secure vector search, secure embeddings, air-gapped deployment, secure NLP, local AI, self-hosted AI, Intracav]
  author: "MagicAF Contributors"

  # Social metadata for Open Graph and Twitter Cards
  social:
    twitter: "intracav"

  # Default Open Graph image (1200x630)
  ogImage: "/og-image.png"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 1
    limit: 15
    keys: ["title", "summary"]

markup:
  goldmark:
    renderer:
      unsafe: true # Lumen UI pages embed raw component-mockup HTML
  highlight:
    noClasses: false # class-based highlighting; palette in assets/css/chroma.css
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: dracula
  tableOfContents:
    startLevel: 2
    endLevel: 3

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 5
    - identifier: docs
      name: Documentation
      url: /docs/
      weight: 10
    - identifier: menu-tutorials
      name: Tutorials
      url: /docs/tutorials/
      weight: 12
    - identifier: menu-lumen-ui
      name: Lumen UI
      url: /docs/lumen-ui/
      weight: 15
    - identifier: api
      name: API Reference
      url: /docs/api-reference/
      weight: 20
    - identifier: examples
      name: Examples
      url: /docs/examples/
      weight: 30
    - identifier: github
      name: ""
      url: "https://github.com/magicaf/magicaf"
      weight: 40
      params:
        external: true
